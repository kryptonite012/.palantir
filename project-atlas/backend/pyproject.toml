[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-atlas"
version = "0.1.0"
description = "PROJECT ATLAS — Offline Intelligence and Data Operations Platform (atlas-api)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Project Atlas contributors" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "httpx>=0.27",
  "pandas>=2.2",
  "pyarrow>=16",
  "duckdb>=1.0",
  "networkx>=3.3",
  "rapidfuzz>=3.9",
  "openpyxl>=3.1",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "reportlab>=4.2",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
test = ["pytest>=8"]

[project.scripts]
atlas = "project_atlas.cli:main"
atlas-desktop = "project_atlas.desktop:main"

[tool.setuptools.packages.find]
include = ["project_atlas*"]

[tool.setuptools.package-data]
project_atlas = ["database/migrations/*.py", "database/migrations/*.mako", "database/migrations/versions/*.py",
                 "reporting/fonts/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:reportlab.*"]
