# nginx reverse proxy for the Project Atlas private-LAN profile (example).
# atlas-api listens on 127.0.0.1:8000; nginx terminates TLS on the LAN interface.
# Use certificates from your organization's internal CA. No external resources are referenced.
server {
    listen 10.0.0.10:443 ssl;            # LAN address of the Atlas server
    server_name atlas.internal;

    ssl_certificate     /etc/pki/atlas/atlas.internal.crt;
    ssl_certificate_key /etc/pki/atlas/atlas.internal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 200m;           # keep in line with ATLAS_MAX_UPLOAD_MB
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_buffering off;             # server-sent events for job progress
    }
}
server {
    listen 10.0.0.10:80;
    server_name atlas.internal;
    return 301 https://$host$request_uri;
}
